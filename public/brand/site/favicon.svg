<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV favicon — Colorway: Official (KYV Green #2F6B4F field, Cream #F5EBD8 monogram,
     Ink #22271F offset shadow — the three brand colors of the official logo).
     Square 1:1 KYV acronym monogram, hand-drawn as vector paths (font-independent)
     and simplified for tiny sizes: at 16px the wordmark is illegible, so per design.md
     the acronym monogram is its square substitute. No wordmark, no readable copy.
     Tokens only: primary, brand-cream, on-surface, radius.lg(12) scaled to the 64 grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Know Your Vote">
  <rect width="64" height="64" rx="12" fill="#2F6B4F"/>
  <!-- Stacked K / Y / V monogram, centered. Two layers: ink shadow (offset),
       cream fill on top — echoing the official wordmark's cream-over-ink build. -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- INK SHADOW LAYER (offset +1.5, +1.4) -->
    <g stroke="#22271F" stroke-opacity="0.9" stroke-width="5">
      <path d="M25.5 15.5 V27.9 M25.5 21.7 L36.5 15.5 M28.4 21.2 L37.5 27.9"/>
      <path d="M24.0 32.6 L31.0 38.9 L38.0 32.6 M31.0 38.9 V45.0"/>
      <path d="M24.0 49.6 L31.0 60.5 L38.0 49.6"/>
    </g>
    <!-- CREAM FILL LAYER -->
    <g stroke="#F5EBD8" stroke-width="5">
      <path d="M24 14 V26.4 M24 20.2 L35 14 M26.9 19.7 L36 26.4"/>
      <path d="M22.5 31.1 L29.5 37.4 L36.5 31.1 M29.5 37.4 V43.5"/>
      <path d="M22.5 48.1 L29.5 59.0 L36.5 48.1"/>
    </g>
  </g>
</svg>
