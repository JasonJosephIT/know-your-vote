<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV UI icon set — Colorway: single-color, uses currentColor so it renders in
     on-surface #22271F or primary #2F6B4F (set via CSS `color`). 24px grid, 1.5px
     stroke, rounded joins/caps, no fills. Non-partisan: no donkey/elephant/flag/eagle,
     no party symbols. Starter set: search, ballot, pin, check, info, share, filter,
     calendar (deadline), home, back.
     Use as an <svg><symbol> sprite: <svg><use href="icons.svg#kyv-search"/></svg>. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      symbol { color: inherit; }
    </style>
  </defs>

  <!-- search -->
  <symbol id="kyv-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <line x1="15.2" y1="15.2" x2="20" y2="20"/>
  </symbol>

  <!-- ballot (card with rows + check) -->
  <symbol id="kyv-ballot" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2.5"/>
    <path d="M7.5 8.2 l1.6 1.6 l2.6 -3"/>
    <line x1="13.5" y1="8.5" x2="16.5" y2="8.5"/>
    <path d="M7.5 14.2 l1.6 1.6 l2.6 -3"/>
    <line x1="13.5" y1="14.5" x2="16.5" y2="14.5"/>
  </symbol>

  <!-- pin (location) -->
  <symbol id="kyv-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21 C 12 21, 5 14.5, 5 9.5 A7 7 0 0 1 19 9.5 C 19 14.5, 12 21, 12 21 Z"/>
    <circle cx="12" cy="9.5" r="2.5"/>
  </symbol>

  <!-- check -->
  <symbol id="kyv-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5 l4.5 4.5 l10.5 -11"/>
  </symbol>

  <!-- info -->
  <symbol id="kyv-info" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <line x1="12" y1="11" x2="12" y2="16.5"/>
    <circle cx="12" cy="7.8" r="0.4"/>
  </symbol>

  <!-- share -->
  <symbol id="kyv-share" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="12" r="2.5"/>
    <circle cx="18" cy="5.5" r="2.5"/>
    <circle cx="18" cy="18.5" r="2.5"/>
    <line x1="8.2" y1="10.8" x2="15.8" y2="6.7"/>
    <line x1="8.2" y1="13.2" x2="15.8" y2="17.3"/>
  </symbol>

  <!-- filter -->
  <symbol id="kyv-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5 H20 L14 12.5 V19 L10 17 V12.5 Z"/>
  </symbol>

  <!-- calendar / deadline -->
  <symbol id="kyv-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="16" height="15" rx="2.5"/>
    <line x1="4" y1="9.5" x2="20" y2="9.5"/>
    <line x1="8" y1="3" x2="8" y2="6.5"/>
    <line x1="16" y1="3" x2="16" y2="6.5"/>
    <path d="M9.5 14.5 l1.6 1.6 l3.2 -3.4"/>
  </symbol>

  <!-- home -->
  <symbol id="kyv-home" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11 L12 4 L20 11"/>
    <path d="M6 9.6 V20 H18 V9.6"/>
    <path d="M10 20 V14.5 H14 V20"/>
  </symbol>

  <!-- back (arrow) -->
  <symbol id="kyv-back" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="19" y1="12" x2="5" y2="12"/>
    <path d="M11 6 L5 12 L11 18"/>
  </symbol>
</svg>
