<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV community-life icon set — sibling sprite to `icons.svg`. Same conventions:
     24px grid, 1.5px stroke, rounded joins/caps, single-color via currentColor
     (renders in on-surface #22271F or primary #2F6B4F via CSS `color`), no fills.
     Non-partisan: neutral everyday community-life motifs only — no party symbols,
     donkey/elephant, flags-as-partisan, campaign signage, government eagle/seal,
     red/blue coding. Set: park, street, storefront, transit, library, bulletin
     board, drop box, bench, streetlight, community, handshake, sun.
     Use as an <svg><symbol> sprite: <svg><use href="community-icons.svg#kyv-park"/></svg>. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      symbol { color: inherit; }
    </style>
  </defs>

  <!-- park (tree + bench) -->
  <symbol id="kyv-park" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="7.5" r="4"/>
    <line x1="7" y1="11.5" x2="7" y2="21"/>
    <line x1="13" y1="18" x2="21" y2="18"/>
    <line x1="13" y1="14.5" x2="13" y2="18"/>
    <line x1="14.5" y1="18" x2="14.5" y2="21"/>
    <line x1="19.5" y1="18" x2="19.5" y2="21"/>
  </symbol>

  <!-- street / neighborhood (row of simple houses) -->
  <symbol id="kyv-street" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 19 L2 13 L5 9 L8 13 L8 19"/>
    <path d="M8.5 19 L8.5 10 L12 4.5 L15.5 10 L15.5 19"/>
    <path d="M16 19 L16 13 L19 9 L22 13 L22 19"/>
    <line x1="1" y1="19" x2="23" y2="19"/>
  </symbol>

  <!-- storefront / main-street shop -->
  <symbol id="kyv-storefront" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9 L5 5.5 L19 5.5 L21 9"/>
    <rect x="4" y="9" width="16" height="11" rx="1"/>
    <rect x="6.5" y="12" width="5" height="5"/>
    <rect x="14.5" y="13.5" width="4.5" height="6.5"/>
  </symbol>

  <!-- bus stop / transit -->
  <symbol id="kyv-transit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="7" width="19" height="9" rx="2"/>
    <line x1="2.5" y1="11" x2="21.5" y2="11"/>
    <line x1="9.5" y1="7" x2="9.5" y2="11"/>
    <line x1="14.5" y1="7" x2="14.5" y2="11"/>
    <circle cx="7" cy="18" r="1.8"/>
    <circle cx="17" cy="18" r="1.8"/>
  </symbol>

  <!-- library / civic building (columns, neutral — no seal) -->
  <symbol id="kyv-library" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8 L12 3 L21 8"/>
    <line x1="3" y1="8" x2="21" y2="8"/>
    <line x1="6" y1="8" x2="6" y2="18"/>
    <line x1="12" y1="8" x2="12" y2="18"/>
    <line x1="18" y1="8" x2="18" y2="18"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </symbol>

  <!-- community bulletin board -->
  <symbol id="kyv-bulletin-board" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="1.5"/>
    <rect x="6" y="7" width="5" height="4" rx="0.5"/>
    <circle cx="8.5" cy="6.3" r="0.6"/>
    <rect x="13" y="9" width="5" height="4" rx="0.5"/>
    <circle cx="15.5" cy="8.3" r="0.6"/>
    <line x1="12" y1="17" x2="12" y2="21"/>
  </symbol>

  <!-- mailbox / ballot drop box (neutral, no partisan mark) -->
  <symbol id="kyv-drop-box" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="16" height="12" rx="2"/>
    <rect x="9" y="5" width="6" height="3" rx="1"/>
    <line x1="7" y1="20" x2="7" y2="22"/>
    <line x1="17" y1="20" x2="17" y2="22"/>
  </symbol>

  <!-- park bench -->
  <symbol id="kyv-bench" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="14.5" x2="21" y2="14.5"/>
    <line x1="3" y1="9.5" x2="3" y2="14.5"/>
    <line x1="3" y1="9.5" x2="9" y2="9.5"/>
    <line x1="4.5" y1="14.5" x2="4.5" y2="20"/>
    <line x1="19.5" y1="14.5" x2="19.5" y2="20"/>
  </symbol>

  <!-- streetlight / lamppost -->
  <symbol id="kyv-streetlight" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="20.5" x2="12" y2="9"/>
    <rect x="8.5" y="5" width="7" height="4.5" rx="2"/>
    <line x1="12" y1="5" x2="12" y2="3.5"/>
    <circle cx="12" cy="2.8" r="0.6"/>
    <line x1="8.5" y1="20.5" x2="15.5" y2="20.5"/>
  </symbol>

  <!-- people / community group -->
  <symbol id="kyv-community" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5.5" cy="8.5" r="2"/>
    <path d="M2 19 Q2 14 5.5 14 Q9 14 9 19"/>
    <circle cx="18.5" cy="8.5" r="2"/>
    <path d="M15 19 Q15 14 18.5 14 Q22 14 22 19"/>
    <circle cx="12" cy="7" r="2.6"/>
    <path d="M7 20.5 Q7 13 12 13 Q17 13 17 20.5"/>
  </symbol>

  <!-- handshake / get involved -->
  <symbol id="kyv-handshake" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 11 L7 11 L9.5 14.5 L11.5 12 L12.5 12 L14.5 14.5 L17 11 L22 11"/>
    <line x1="2" y1="9" x2="2" y2="13.5"/>
    <line x1="22" y1="9" x2="22" y2="13.5"/>
  </symbol>

  <!-- sun / park-day motif -->
  <symbol id="kyv-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4.5"/>
    <line x1="12" y1="3" x2="12" y2="5.5"/>
    <line x1="12" y1="18.5" x2="12" y2="21"/>
    <line x1="3" y1="12" x2="5.5" y2="12"/>
    <line x1="18.5" y1="12" x2="21" y2="12"/>
    <line x1="5.9" y1="5.9" x2="7.6" y2="7.6"/>
    <line x1="16.4" y1="16.4" x2="18.1" y2="18.1"/>
    <line x1="5.9" y1="18.1" x2="7.6" y2="16.4"/>
    <line x1="16.4" y1="7.6" x2="18.1" y2="5.9"/>
  </symbol>
</svg>
