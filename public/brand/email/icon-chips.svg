<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV Email Inline Icon Chips — MASTER (all three glyphs). Colorway: OFFICIAL/MONO —
     single-color KYV Green #2F6B4F glyphs (a design.md token; each also renders cleanly as
     Mono Ink #22271F if a client needs it). 48x48 each, simple single-color glyphs
     (calendar, check, pin) with a heavy ~4px stroke and rounded joins so they stay legible
     at small size in hostile email clients — NO fine detail (renders muddy). Reuses the
     pin/check motif language from hero.svg and the UI icon set (site/icons.svg).
     Each glyph below is exported to its own 48x48 PNG in a later ImageMagick step.
     Tokens only: primary #2F6B4F. Transparent background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 48" width="168" height="48">
  <!-- CALENDAR (48x48 cell at x=0) -->
  <g id="chip-calendar" transform="translate(0 0)" stroke="#2F6B4F" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="9" y="12" width="30" height="28" rx="5"/>
    <path d="M9 20 H39"/>
    <path d="M17 8 V15 M31 8 V15"/>
    <circle cx="24" cy="30" r="0.5" fill="#2F6B4F" stroke-width="4"/>
  </g>
  <!-- CHECK (48x48 cell at x=60) -->
  <g id="chip-check" transform="translate(60 0)" stroke="#2F6B4F" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="24" cy="24" r="16"/>
    <path d="M16 24 l6 6 l11 -13"/>
  </g>
  <!-- PIN (48x48 cell at x=120) -->
  <g id="chip-pin" transform="translate(120 0)" stroke="#2F6B4F" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M24 9 C 32 9, 38 15, 38 23 C 38 33, 26 39, 24 42 C 22 39, 10 33, 10 23 C 10 15, 16 9, 24 9 Z"/>
    <circle cx="24" cy="22" r="5"/>
  </g>
</svg>
