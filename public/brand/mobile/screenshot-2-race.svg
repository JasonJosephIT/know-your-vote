    <text x="285" y="1075" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="1" fill="#585E52">STATED POSITION</text>
    <rect x="285" y="1095" width="320" height="8" rx="4" fill="#EFEAE0"/>
    <rect x="285" y="1120" width="320" height="8" rx="4" fill="#EFEAE0"/>
