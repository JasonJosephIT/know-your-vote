    <text x="845" y="1568" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="26" fill="#2F6B4F">View details</text>

    <!-- how we verify note -->
    <rect x="245" y="1900" width="800" height="120" rx="12" fill="#E4EFE7"/>
    <text x="285" y="1955" font-family="Inter, sans-serif" font-weight="600" font-size="28" fill="#255A41">How we verify</text>
    <text x="285" y="1995" font-family="Inter, sans-serif" font-size="24" fill="#585E52">Stated position, verified fact, outside opinion &#8212; kept separate.</text>

