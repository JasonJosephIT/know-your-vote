    <text x="760" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#585E52">Verify</text>
    <text x="980" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#585E52">About</text>
