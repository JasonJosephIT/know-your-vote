    <!-- eyebrow -->
    <text x="245" y="640" font-family="Inter, sans-serif" font-weight="700" font-size="24" letter-spacing="2" fill="#585E52">ON YOUR BALLOT</text>

    <!-- ===== EQUAL COLUMNS: two candidate cards, identical geometry ===== -->
    <!-- Column A: x 245..660 (width 400) ; Column B: x 685..1045 (width 400) ; equal gap -->
    <!-- Card A -->
    <rect x="245" y="680" width="400" height="1160" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
    <!-- Card B -->
    <rect x="645" y="680" width="400" height="1160" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>

