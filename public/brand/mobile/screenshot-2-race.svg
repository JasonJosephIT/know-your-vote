    <path d="M418 812 a27 27 0 0 1 54 0 M445 786 m-20 -6 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0" fill="#CFC7B6"/>
    <path d="M818 812 a27 27 0 0 1 54 0 M845 786 m-20 -6 a20 20 0 1 0 40 0 a20 20 0 1 0 -40 0" fill="#CFC7B6"/>

