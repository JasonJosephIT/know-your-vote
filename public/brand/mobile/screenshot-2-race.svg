    <text x="285" y="1240" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="1" fill="#585E52">VERIFIED RECORD</text>
    <rect x="285" y="1265" width="300" height="52" rx="26" fill="#EFEAE0"/>
    <circle cx="315" cy="1291" r="9" fill="#2F6B4F"/>
    <text x="338" y="1300" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#22271F">Accurate</text>

    <text x="685" y="1240" font-family="Inter, sans-serif" font-weight="700" font-size="22" letter-spacing="1" fill="#585E52">VERIFIED RECORD</text>
    <rect x="685" y="1265" width="300" height="52" rx="26" fill="#EFEAE0"/>
    <circle cx="715" cy="1291" r="9" fill="#B07A1E"/>
    <text x="738" y="1300" font-family="Inter, sans-serif" font-weight="500" font-size="24" fill="#22271F">Mixed</text>

    <!-- more source lines (equal) -->
    <rect x="285" y="1360" width="320" height="8" rx="4" fill="#EFEAE0"/>
    <rect x="285" y="1385" width="280" height="8" rx="4" fill="#EFEAE0"/>
    <rect x="685" y="1360" width="320" height="8" rx="4" fill="#EFEAE0"/>
    <rect x="685" y="1385" width="280" height="8" rx="4" fill="#EFEAE0"/>

    <!-- source citation line (mono), identical -->
    <text x="285" y="1470" font-family="IBM Plex Mono, monospace" font-size="20" fill="#585E52">3 sources &#183; updated 2026</text>
    <text x="685" y="1470" font-family="IBM Plex Mono, monospace" font-size="20" fill="#585E52">3 sources &#183; updated 2026</text>

    <!-- equal 'view details' secondary buttons -->
