<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV App Store / Play Screenshot 2 — Colorway: OFFICIAL. 1290x2796 (iPhone 6.7").
     COMPOSITED surface: device frame + neutral side-by-side race UI crop + ONE short baked caption.
     NON-PARTISAN INVARIANTS: two candidates in EQUAL-WIDTH columns, IDENTICAL type/spacing,
     UNIFORM neutral party chips (same surface-muted treatment for every party), placeholder names
     "Candidate A"/"Candidate B" (no real/fabricated names), no candidate favored. Verdict shown as
     dot + text label (never color-only). All colors are design.md tokens. Inline attrs (ImageMagick-safe). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796" font-family="Inter, sans-serif">
  <rect width="1290" height="2796" fill="#2F6B4F"/>
  <text x="645" y="150" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="700" font-size="72" fill="#F5EBD8">Every candidate, equal.</text>
  <text x="645" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-weight="400" font-size="42" fill="#F5EBD8" opacity="0.92">Same space, same weight. No spin.</text>

  <!-- device frame -->
  <rect x="165" y="360" width="960" height="2300" rx="96" fill="#22271F"/>
  <rect x="189" y="384" width="912" height="2252" rx="76" fill="#F6F3EC"/>
  <rect x="545" y="384" width="200" height="46" rx="23" fill="#22271F"/>

  <g clip-path="url(#screen2)">
