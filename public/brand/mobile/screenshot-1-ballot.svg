<?xml version="1.0" encoding="UTF-8"?>
<!-- KYV App Store / Play Screenshot 1 — Colorway: OFFICIAL. 1290x2796 (iPhone 6.7").
     COMPOSITED surface: device frame + a plausible neutral KYV UI crop + ONE short baked caption.
     Non-partisan: neutral placeholder races, no candidate favored, no party color-coding.
     All colors are design.md tokens (resolved hex). Type: Figtree headings / Inter body.
     Inline presentation attributes only (ImageMagick-safe). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 2796" width="1290" height="2796" font-family="Inter, sans-serif">
  <!-- caption band background -->
  <rect width="1290" height="2796" fill="#2F6B4F"/>
  <!-- ONE short caption (baked; this is a composited store surface) -->
  <text x="645" y="150" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="700" font-size="72" fill="#F5EBD8">See your whole ballot.</text>
  <text x="645" y="238" text-anchor="middle" font-family="Inter, sans-serif" font-weight="400" font-size="42" fill="#F5EBD8" opacity="0.92">Enter your ZIP. Nonpartisan, every race.</text>

  <!-- ==== DEVICE FRAME ==== -->
  <g>
    <rect x="165" y="360" width="960" height="2300" rx="96" fill="#22271F"/>
    <rect x="189" y="384" width="912" height="2252" rx="76" fill="#F6F3EC"/>
    <!-- notch -->
    <rect x="545" y="384" width="200" height="46" rx="23" fill="#22271F"/>
  </g>

  <!-- ==== UI CROP (clipped to screen) ==== -->
  <g clip-path="url(#screen)">
    <clipPath id="screen"><rect x="189" y="384" width="912" height="2252" rx="76"/></clipPath>
    <!-- app background -->
    <rect x="189" y="384" width="912" height="2252" fill="#F6F3EC"/>

    <!-- top app bar (surface) with compact green monogram -->
    <rect x="189" y="430" width="912" height="120" fill="#FFFFFF"/>
    <rect x="189" y="549" width="912" height="1" fill="#E4DED2"/>
    <g transform="translate(245,468)" stroke="#2F6B4F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-16 -20 V16 M-16 -2 L16 -20 M-8 -3 L18 16"/>
    </g>
    <text x="300" y="500" font-family="Figtree, sans-serif" font-weight="700" font-size="34" fill="#22271F">Know Your Vote</text>

    <!-- ZIP entry card -->
    <rect x="245" y="600" width="800" height="220" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
    <text x="285" y="672" font-family="Inter, sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#585E52">YOUR FLORIDA BALLOT</text>
    <rect x="285" y="700" width="500" height="86" rx="8" fill="#FFFFFF" stroke="#2F6B4F" stroke-width="4"/>
    <text x="315" y="756" font-family="IBM Plex Mono, monospace" font-size="38" fill="#22271F">32801</text>
    <rect x="805" y="700" width="200" height="86" rx="8" fill="#2F6B4F"/>
    <text x="905" y="756" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="30" fill="#FFFFFF">See ballot</text>

    <!-- races on your ballot (equal-weight rows) -->
    <text x="285" y="900" font-family="Figtree, sans-serif" font-weight="700" font-size="40" fill="#22271F">Races on your ballot</text>

    <!-- race row template x3, identical treatment -->
    <g>
      <rect x="245" y="940" width="800" height="150" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
      <text x="285" y="1000" font-family="Inter, sans-serif" font-weight="700" font-size="30" fill="#22271F">U.S. House &#183; District 10</text>
      <text x="285" y="1048" font-family="Inter, sans-serif" font-size="26" fill="#585E52">2 candidates</text>
      <text x="1005" y="1028" text-anchor="end" font-family="Inter, sans-serif" font-size="34" fill="#2F6B4F">&#8250;</text>
    </g>
    <g>
      <rect x="245" y="1110" width="800" height="150" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
      <text x="285" y="1170" font-family="Inter, sans-serif" font-weight="700" font-size="30" fill="#22271F">State Senate &#183; District 15</text>
      <text x="285" y="1218" font-family="Inter, sans-serif" font-size="26" fill="#585E52">2 candidates</text>
      <text x="1005" y="1198" text-anchor="end" font-family="Inter, sans-serif" font-size="34" fill="#2F6B4F">&#8250;</text>
    </g>
    <g>
      <rect x="245" y="1280" width="800" height="150" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
      <text x="285" y="1340" font-family="Inter, sans-serif" font-weight="700" font-size="30" fill="#22271F">County Commission &#183; Seat 3</text>
      <text x="285" y="1388" font-family="Inter, sans-serif" font-size="26" fill="#585E52">2 candidates</text>
      <text x="1005" y="1368" text-anchor="end" font-family="Inter, sans-serif" font-size="34" fill="#2F6B4F">&#8250;</text>
    </g>
    <g>
      <rect x="245" y="1450" width="800" height="150" rx="12" fill="#FFFFFF" stroke="#E4DED2" stroke-width="2"/>
      <text x="285" y="1510" font-family="Inter, sans-serif" font-weight="700" font-size="30" fill="#22271F">School Board &#183; District 4</text>
      <text x="285" y="1558" font-family="Inter, sans-serif" font-size="26" fill="#585E52">2 candidates</text>
      <text x="1005" y="1538" text-anchor="end" font-family="Inter, sans-serif" font-size="34" fill="#2F6B4F">&#8250;</text>
    </g>

    <!-- bottom nav bar (4 sections) -->
    <rect x="189" y="2470" width="912" height="166" fill="#FFFFFF"/>
    <rect x="189" y="2470" width="912" height="1" fill="#E4DED2"/>
    <!-- active pill on first item -->
    <rect x="235" y="2500" width="170" height="60" rx="8" fill="#E4EFE7"/>
    <text x="320" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="24" fill="#255A41">Ballot</text>
    <text x="530" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#585E52">Races</text>
    <text x="760" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#585E52">Verify</text>
    <text x="980" y="2540" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#585E52">About</text>
  </g>
</svg>
